; RIOT Modbus TCP Test Unit (CYD-TESTER) - ESP32-2432S028R
; Arduino core 2.0.14 (espressif32 6.5.0): TFT_eSPI is reliable on core 2.x.

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.5.0
framework = arduino
board = esp32dev
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_port = COM14
upload_port = COM14
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -include "$PROJECT_INCLUDE_DIR/board_pins.h"
    -DTOML_EXCEPTIONS=0
    -DTOML_HEADER_ONLY=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
